# Phoenix ZerØ — CI (Layer 1 build gate + Layer 2 offline core tests)
# The build steps MIRROR the Render buildCommand that is known to pass:
#   npm ci --include=dev
#   npm --prefix ./apps/web ci --include=dev
#   npx tsc -p ./libs/phoenix-zero/tsconfig.build.json   (core built via tsc directly)
#   npm --prefix ./apps/web run build
# If this job is green, the Render deploy will also build.
# The core-test step is NON-BLOCKING in this phase (continue-on-error): the deploy gate
# stays green while we stabilize tests on CI; the test result still shows in the run.
# NOTE: real-payment tests (test:agentic:real*) are intentionally NOT here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-core-test:
    name: Build gate (mirrors Render) + core tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root deps
        run: npm ci --include=dev

      - name: Install web deps
        run: npm --prefix ./apps/web ci --include=dev

      - name: Build core (tsc, exactly as Render)
        run: npx tsc -p ./libs/phoenix-zero/tsconfig.build.json

      - name: Build web (next build, mirrors Render)
        run: npm --prefix ./apps/web run build

      - name: Core unit tests (offline; non-blocking this phase)
        continue-on-error: true
        run: npm run test:core
