<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verificação</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
        width: 340px;
        color: #111827;
      }
      .title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      .card {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 10px;
        display: grid;
        gap: 10px;
      }
      .status {
        border-radius: 12px;
        padding: 10px;
        color: white;
      }
      .status.ok {
        background: #065f46;
      }
      .status.mid {
        background: #92400e;
      }
      .status.warn {
        background: #111827;
      }
      .status.bad {
        background: #7f1d1d;
      }
      .row {
        display: grid;
        gap: 6px;
      }
      label {
        font-size: 12px;
        font-weight: 600;
        color: #374151;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 8px 10px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary {
        background: #111827;
        color: white;
      }
      button.secondary {
        background: #f3f4f6;
        color: #111827;
      }
      .muted {
        font-size: 12px;
        color: #6b7280;
      }
      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .buttons3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <div class="title">Verificação</div>

    <div class="card">
      <div id="status" class="status warn">Aguardando…</div>

      <div class="buttons">
        <button id="openDetails" class="primary" disabled>Ver detalhes</button>
        <button id="openDemo" class="secondary">Abrir demo</button>
      </div>

      <div class="row">
        <label for="verifyOrigin">Servidor de verificação</label>
        <input id="verifyOrigin" placeholder="http://localhost:3000" />
        <div class="buttons3">
          <button id="save" class="secondary">Salvar</button>
          <button id="useAuto" class="secondary">Auto</button>
          <button id="refresh" class="secondary">Atualizar</button>
        </div>
        <div id="originInfo" class="muted"></div>
        <div class="muted">
          Dica: em produção, esse campo deve ser o domínio do seu verificador.
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
